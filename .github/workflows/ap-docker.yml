name: Daily Update

on:
  schedule:
    - cron: '5 1 * * *'  # 每天早上北京时间09:05更新(UTC时间1:05)
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2  # 用于 diff（如需）

      - name: Update README with timestamp
        run: |
          UTC_TIME=$(date -u +'%Y-%m-%d %H:%M:%S')
          BJ_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')

          TIMESTAMP_SECTION="\n## 🕒 最后更新时间\n\n"
          TIMESTAMP_SECTION+="**UTC**: \`$UTC_TIME\`  \n"
          TIMESTAMP_SECTION+="**北京时间**: \`$BJ_TIME\`  \n\n"
          TIMESTAMP_SECTION+="> ⚡ 此时间戳由 GitHub Actions 自动更新\n"

          if grep -q "## 🕒 最后更新时间" README.md; then
            sed -i '/## 🕒 最后更新时间/,/^## \|^# /{//!d}' README.md
            sed -i '/## 🕒 最后更新时间/d' README.md
          fi

          echo -e "$TIMESTAMP_SECTION" >> README.md

      - name: Auto commit changes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto deploy by GitHub Actions"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          file_pattern: README.md

      # --------------------------------------
      # Telegram 推送（成功）
      # --------------------------------------
      - name: Telegram Notification (Success)
        if: success()
        run: |
          MESSAGE="$(cat << 'EOF'
📢 *GitHub Actions Update*

📁 *Repository:* `${{ github.repository }}`

⏱️ *Update Time (UTC):* `$(date -u +'%Y-%m-%d %H:%M:%S')`

⚡️ README timestamp updated automatically.
EOF
)"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT_ID }}" \
            -d text="$MESSAGE" \
            -d parse_mode="Markdown"

      # --------------------------------------
      # Telegram 推送（失败）
      # --------------------------------------
      - name: Telegram Notification (Failure)
        if: failure()
        run: |
          MESSAGE="$(cat << 'EOF'
❌ *GitHub Actions Failed!*

📁 *Repository:* `${{ github.repository }}`

⚠️ Workflow execution failed.
Please check the GitHub Actions logs.
EOF
)"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT_ID }}" \
            -d text="$MESSAGE" \
            -d parse_mode="Markdown"
