name: Daily Update

on:
  schedule:
    - cron: '5 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Update README with timestamp
        run: |
          UTC_TIME=$(date -u +'%Y-%m-%d %H:%M:%S')
          BJ_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')

          TIMESTAMP_SECTION="\n## 🕒 最后更新时间\n\n"
          TIMESTAMP_SECTION+="**UTC**: \`$UTC_TIME\`  \n"
          TIMESTAMP_SECTION+="**北京时间**: \`$BJ_TIME\`  \n\n"
          TIMESTAMP_SECTION+="> ⚡ 此时间戳由 GitHub Actions 自动更新\n"

          if grep -q "## 🕒 最后更新时间" README.md; then
            sed -i '/## 🕒 最后更新时间/,/^## \|^# /{//!d}' README.md
            sed -i '/## 🕒 最后更新时间/d' README.md
          fi

          echo -e "$TIMESTAMP_SECTION" >> README.md

      - name: Auto commit changes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto deploy by Github Actions"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          file_pattern: README.md

      - name: Generate diff summary
        id: diff
        run: |
          DIFF=$(git diff HEAD~1 HEAD README.md || echo "No diff available")

          SAFE_DIFF=$(printf "%s\n" "$DIFF" \
            | sed -e 's/`/\\`/g' -e 's/*/\\*/g' -e 's/_/\\_/g')

          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SAFE_DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Telegram Success Message
        if: success()
        run: |
          MESSAGE="🎉 *GitHub Actions 执行成功！*\n\n\
📁 仓库: \`${{ github.repository }}\`\n\
🕒 UTC 时间: $(date -u +'%Y-%m-%d %H:%M:%S')\n\
📝 *README 修改摘要：*\n\`\`\`\n${{ steps.diff.outputs.summary }}\n\`\`\`\n\
✅ 状态：成功"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT_ID }}" \
            -d text="$MESSAGE" \
            -d parse_mode="Markdown"

      - name: Telegram Failure Message
        if: failure()
        run: |
          MESSAGE="❌ *GitHub Actions 执行失败！*\n\n\
📁 仓库: \`${{ github.repository }}\`\n\
⚠ 请检查 Actions 日志\n\
状态：失败"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TG_CHAT_ID }}" \
            -d text="$MESSAGE" \
            -d parse_mode="Markdown"
